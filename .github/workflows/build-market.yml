name: Build & Release Cindy Plugins Market

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 彻底清除 main 分支二进制占用
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -rf plugins/*/bin/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: 彻底清除 main 分支内嵌二进制，保持主干零占用"
            git push origin main
          fi

      - name: 构建单平台瘦身包与市场清单
        shell: bash
        run: |
          python3 -u scripts/build-market.py 2>&1 | tee /tmp/build.log || {
            python3 scripts/report-err.py /tmp/build.log || true
            exit 1
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 检查生成产物
        run: |
          ls -la dist/packages/
          cat .agents/plugins/marketplace.json | head -n 40

      - name: 发布各平台 .cindy 资产到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          name: "v0.1.1 - 规范全平台架构专属轻量分发"
          files: dist/packages/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理旧命名分支并推送 6 大标准架构独立分支 (plat/*)
        shell: bash
        run: |
          python3 -u scripts/build-market.py --push-branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
