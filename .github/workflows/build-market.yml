name: Build & Release Cindy Plugins Market

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 拉取上游发布资产（aiod-cli / cube-cli 独立仓库）
        shell: bash
        run: |
          python3 -u scripts/build-market.py --fetch

      - name: 将全架构二进制矩阵内嵌进 main 分支
        shell: bash
        run: |
          python3 scripts/embed-binaries.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/*/bin/
          if ! git diff --cached --quiet; then
            git commit -m "chore: 自动化同步补齐全架构二进制矩阵到 main 分支"
            git push origin main
          fi

      - name: 构建单平台瘦身包与市场清单
        shell: bash
        run: |
          python3 -u scripts/build-market.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 检查生成产物与计算版本
        run: |
          ls -la dist/packages/
          cat .agents/plugins/marketplace.json | head -n 40
          TAG="v$(python3 -c 'import json; m=json.load(open("scripts/manifest.json")); print(max(p["version"] for p in m["plugins"].values()))')"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Resolved Release tag: $TAG"

      - name: 发布各平台 .cindy 资产到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ env.RELEASE_TAG }} - 自动构建多架构 Cindy 插件市场产物"
          files: dist/packages/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
