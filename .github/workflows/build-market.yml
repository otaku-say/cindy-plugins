name: Build & Release Cindy Plugins Market

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Zig 交叉编译器
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: 交叉编译 Windows 原生 aiod-cli.exe
        shell: bash
        run: |
          mkdir -p .cache/upstream/aiod-cli
          
          echo "=== 编译 Windows 64-bit (x86_64-windows-gnu) ==="
          zig cc -target x86_64-windows-gnu -O2 -s scripts/aiod_win_shim.c -o .cache/upstream/aiod-cli/aiod-cli-x86_64-windows-gnu.exe
          
          echo "=== 编译 Windows ARM64 (aarch64-windows-gnu) ==="
          zig cc -target aarch64-windows-gnu -O2 -s scripts/aiod_win_shim.c -o .cache/upstream/aiod-cli/aiod-cli-aarch64-windows-gnu.exe
          
          ls -la .cache/upstream/aiod-cli/*.exe

      - name: 将全架构二进制矩阵内嵌进 main 分支
        shell: bash
        run: |
          python3 scripts/embed-binaries.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/*/bin/
          if ! git diff --cached --quiet; then
            git commit -m "chore: 自动化同步补齐全架构二进制矩阵到 main 分支"
            git push origin main
          fi

      - name: 构建单平台瘦身包与市场清单
        shell: bash
        run: |
          python3 -u scripts/build-market.py 2>&1 | tee /tmp/build.log || {
            python3 scripts/report-err.py /tmp/build.log || true
            exit 1
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 检查生成产物
        run: |
          ls -la dist/packages/
          cat .agents/plugins/marketplace.json | head -n 40

      - name: 发布各平台 .cindy 资产到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.3
          name: "v0.1.3 - 修复 cindy.send 交卷协议与网关环境变量兜底，彻底解决调用挂起超时问题"
          files: dist/packages/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理旧命名分支并推送 6 大标准架构独立分支 (plat/*)
        shell: bash
        run: |
          python3 -u scripts/build-market.py --push-branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
