name: Build & Release Cindy Plugins Market

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 运行插件测试（失败即阻断构建与发布）
        shell: bash
        run: node --test tests/test_plugins.js

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 拉取上游发布资产（aiod-cli / cube-cli 独立仓库）
        shell: bash
        run: |
          python3 -u scripts/build-market.py --fetch

      - name: 内嵌上游二进制（内容变化时自动递增插件 patch 版本）
        shell: bash
        run: |
          python3 scripts/embed-binaries.py --bump
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 版本号与 bin/ 必须同一笔提交：否则 marketplace 里的版本与包体内容会错位，
          # 本地 Cindy 也就不会认为「有更新」。
          git add plugins/*/bin plugins/*/ghost.json scripts/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 同步上游二进制并递增受影响插件的 patch 版本"
            git push origin main
          fi

      - name: 构建单平台瘦身包与市场清单
        shell: bash
        run: |
          python3 -u scripts/build-market.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交市场清单（自定义 git 市场的版本信号）
        shell: bash
        run: |
          # Cindy 的 git 市场直接读 .agents/plugins/marketplace.json 里的 version；
          # 这份清单如果只生成不提交，客户端永远看到旧版本，只给「替换」不给「更新」。
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .agents/plugins/marketplace.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(market): 更新市场清单版本与产物指纹"
            git push origin main
          fi

      - name: 检查生成产物与计算版本
        run: |
          ls -la dist/packages/
          cat .agents/plugins/marketplace.json | head -n 40
          TAG="v$(python3 -c 'import json; m=json.load(open("scripts/manifest.json")); print(max(p["version"] for p in m["plugins"].values()))')"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Resolved Release tag: $TAG"

      - name: 发布各平台 .cindy 资产到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "${{ env.RELEASE_TAG }} - 自动构建多架构 Cindy 插件市场产物"
          files: dist/packages/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
