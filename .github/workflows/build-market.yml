name: Build & Release Cindy Plugins Market

on:
  push:
    branches: [main]
    paths-ignore:
      - 'plugins/**/bin/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建单平台瘦身包与市场清单
        run: |
          python3 scripts/build-market.py

      - name: 检查生成产物
        run: |
          ls -la dist/packages/
          cat .agents/plugins/marketplace.json | head -n 40

      - name: 发布各平台 .cindy 资产到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: "v0.1.0 - CubeSandbox 插件全平台发布"
          files: dist/packages/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送单平台轻量分支 (plat/*)
        shell: bash
        run: |
          python3 scripts/build-market.py --push-branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 同步全架构二进制到 main 分支插件目录
        shell: bash
        run: |
          python3 scripts/embed-binaries.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/
          if ! git diff --cached --quiet; then
            git commit -m "chore: 为 main 分支各插件预置全系统芯片架构二进制矩阵"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
