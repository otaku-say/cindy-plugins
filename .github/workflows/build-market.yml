name: Build & Release Cindy Plugins Market

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建单平台瘦身包与市场清单
        run: |
          python3 scripts/build-market.py

      - name: 检查生成产物
        run: |
          ls -la dist/packages/
          cat .agents/plugins/marketplace.json | head -n 40

      - name: 发布各平台 .cindy 资产到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: "v0.1.0 - CubeSandbox 插件全平台发布"
          files: dist/packages/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送单平台轻量分支 (plat/*)
        shell: bash
        run: |
          python3 scripts/build-market.py --push-branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

