<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>My Env 环境变量与凭据中枢</title>
  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      --bg: var(--surface, #ffffff);
      --fg: var(--text-primary, #1f2328);
      --fg-muted: var(--text-secondary, #656d76);
      --border: var(--border-default, #d0d7de);
      --primary: #0969da;
      --primary-hover: #0856b3;
      --primary-soft: rgba(9, 105, 218, 0.08);
      --danger: #cf222e;
      --danger-hover: #a40e26;
      --danger-soft: rgba(207, 34, 46, 0.08);
      --card-bg: var(--surface-elevated, #f6f8fa);
      --input-bg: var(--surface, #ffffff);
      --pill-bg: rgba(127, 127, 127, 0.08);
      --pill-border: rgba(127, 127, 127, 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--surface, #0d1117);
        --fg: var(--text-primary, #e6edf3);
        --fg-muted: var(--text-secondary, #848d97);
        --border: var(--border-default, #30363d);
        --primary: #2f81f7;
        --primary-hover: #58a6ff;
        --primary-soft: rgba(47, 129, 247, 0.12);
        --danger: #f85149;
        --danger-hover: #da3633;
        --danger-soft: rgba(248, 81, 73, 0.12);
        --card-bg: var(--surface-elevated, #161b22);
        --input-bg: var(--surface, #0d1117);
        --pill-bg: rgba(255, 255, 255, 0.05);
        --pill-border: rgba(255, 255, 255, 0.12);
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.5;
      color: var(--fg);
      background: var(--bg);
      margin: 0;
      padding: 16px;
    }
    h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px 0; }
    .subtitle { color: var(--fg-muted); font-size: 12px; margin-bottom: 16px; }

    /* 表单卡片 */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .card-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .full-width { grid-column: 1 / -1; }
    label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 4px; color: var(--fg-muted); }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      padding: 7px 10px;
      font-size: 12px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--fg);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    textarea {
      resize: vertical;
      min-height: 52px;
      line-height: 1.4;
    }
    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-soft);
    }

    /* 按钮组 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--fg);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--border); }
    .btn-primary { background: var(--primary); color: #ffffff; border-color: transparent; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-sm { padding: 3px 8px; font-size: 11px; }

    /* 图标按钮样式 */
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--fg-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 0;
      flex-shrink: 0;
    }
    .icon-btn:hover {
      background: var(--card-bg);
      color: var(--fg);
      border-color: var(--border);
    }
    .icon-btn.edit-btn:hover {
      color: var(--primary);
      background: var(--primary-soft);
      border-color: transparent;
    }
    .icon-btn.del-btn:hover {
      color: var(--danger);
      background: var(--danger-soft);
      border-color: transparent;
    }

    /* 搜索栏与过滤 */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .search-box {
      flex: 1;
      position: relative;
    }
    .search-box input {
      padding-left: 28px;
    }
    .search-icon {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--fg-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    /* 双行列表项结构 */
    .env-list-container {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      overflow: hidden;
    }
    .env-item {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s ease;
      display: flex;
      flex-col;
      gap: 6px;
      flex-direction: column;
    }
    .env-item:last-child {
      border-bottom: none;
    }
    .env-item:hover {
      background: rgba(127, 127, 127, 0.04);
    }

    /* 第一行：Key + Value + 操作区 */
    .env-row-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .env-left-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .key-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      font-size: 13px;
      color: var(--primary);
      letter-spacing: 0.3px;
    }

    /* 脱敏值胶囊小组件 */
    .val-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      padding: 2px 8px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: var(--fg-muted);
    }
    .val-text {
      user-select: text;
    }
    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      background: transparent;
      border: none;
      color: var(--fg-muted);
      cursor: pointer;
      border-radius: 3px;
      transition: color 0.12s;
    }
    .pill-btn:hover {
      color: var(--fg);
    }

    /* 操作图标区域（横向紧凑） */
    .sens-badge {
      font-size: 10px;
      line-height: 1;
      padding: 3px 6px;
      border-radius: 999px;
      border: 1px solid var(--pill-border);
      background: var(--pill-bg);
      color: var(--fg-muted);
      flex-shrink: 0;
    }
    .check-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--fg);
    }
    .check-row input[type="checkbox"] {
      width: 14px;
      height: 14px;
      margin: 0;
      flex-shrink: 0;
    }
    .env-actions {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    /* 第二行：备注说明 */
    .env-row-memo {
      font-size: 12px;
      color: var(--fg-muted);
      line-height: 1.4;
      word-break: break-word;
      padding-left: 2px;
    }

    .empty-tip {
      text-align: center;
      padding: 32px 16px;
      color: var(--fg-muted);
      font-size: 12px;
    }

    /* 分页控制器 */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 12px;
      color: var(--fg-muted);
    }
    .page-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 备份与迁移（导出 / 导入） */
    .mig-actions { display: inline-flex; align-items: center; gap: 6px; }
    .io-panel { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; }
    .io-hint { font-size: 11px; color: var(--fg-muted); line-height: 1.55; margin-bottom: 8px; }
    .io-hint strong { color: var(--fg); font-weight: 600; }
    .io-hint code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 4px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
    }
    .io-text {
      min-height: 104px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
    }
    .io-footer { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .io-stats { flex: 1; min-width: 0; font-size: 11px; color: var(--fg-muted); word-break: break-word; }
    .io-stats .warn { color: var(--danger); }

    /* 状态提示 */
    .toast {
      display: none;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .toast-success { background: rgba(46, 160, 67, 0.15); color: #2ea043; border: 1px solid rgba(46, 160, 67, 0.3); }
    .toast-error { background: rgba(207, 34, 46, 0.15); color: var(--danger); border: 1px solid rgba(207, 34, 46, 0.3); }
  </style>
</head>
<body>
  <h2>全局环境变量与凭据中枢 (My Env)</h2>
  <div class="subtitle">键值以明文存在本机插件存储（v0.3.0 起不再镜像到 /kv，目录 0700、文件 0600），Agent 可按需读取：请勿存放生产级高价值凭据；GitHub 等服务优先用支持主机托管登入的官方插件。</div>
  <div class="subtitle" id="storeInfo"></div>

  <div id="toast" class="toast"></div>

  <!-- 新增/编辑卡片 -->
  <div class="card">
    <div class="card-title">
      <span id="formTitle">添加新变量</span>
      <button id="cancelEditBtn" class="btn btn-sm" style="display: none;">取消编辑</button>
    </div>
    <div class="form-grid">
      <div>
        <label for="envKey">变量键名 (Key) *</label>
        <input type="text" id="envKey" placeholder="例如: GITHUB_TOKEN" autocomplete="off" />
      </div>
      <div>
        <label for="envValue">变量键值 (Value) *</label>
        <div style="position: relative;">
          <input type="password" id="envValue" placeholder="例如: ghp_xxxx" autocomplete="off" style="padding-right: 50px;" />
          <button type="button" id="toggleValBtn" class="btn btn-sm" style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); padding: 2px 6px;">显示</button>
        </div>
      </div>
      <div class="full-width">
        <label for="envMemo">备注说明 (Memo)</label>
        <textarea id="envMemo" rows="2" placeholder="例如: 个人 GitHub 账户 PAT，含 repo 和 workflow 权限" autocomplete="off"></textarea>
      </div>
      <div class="full-width">
        <label class="check-row" for="envSensitive">
          <input type="checkbox" id="envSensitive" checked />
          <span>敏感（列表全掩码，仅供单键读取）</span>
        </label>
      </div>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 8px;">
      <button id="saveBtn" class="btn btn-primary">保存变量</button>
    </div>
  </div>

  <!-- 备份与迁移：整包导出 / 导入（用户手动操作；Agent 侧仍无批量读取工具） -->
  <div class="card">
    <div class="card-title">
      <span>备份与迁移</span>
      <span class="mig-actions">
        <button id="exportBtn" class="btn btn-sm" title="导出全部变量为 JSON">导出全部</button>
        <button id="importBtn" class="btn btn-sm" title="从 JSON 导入变量">导入</button>
        <button id="ioCloseBtn" class="icon-btn" title="收起" aria-label="收起" style="display: none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </span>
    </div>
    <div id="ioPanel" class="io-panel" style="display: none;">
      <div id="ioHint" class="io-hint"></div>
      <textarea id="ioText" class="io-text" rows="7" spellcheck="false" autocomplete="off" placeholder="在此粘贴 JSON…"></textarea>
      <label class="check-row" id="ioOverwriteRow" for="ioOverwrite" style="display: none;">
        <input type="checkbox" id="ioOverwrite" />
        <span>覆盖同名变量（不勾选则只新增，已有键保持原值）</span>
      </label>
      <input type="file" id="ioFile" accept=".json,application/json" style="display: none;" />
      <div class="io-footer">
        <span id="ioStats" class="io-stats"></span>
        <button id="ioFileBtn" class="btn btn-sm" style="display: none;">选择文件…</button>
        <button id="ioDownloadBtn" class="btn btn-sm" style="display: none;">下载 .json</button>
        <button id="ioPrimaryBtn" class="btn btn-sm btn-primary">复制 JSON</button>
      </div>
    </div>
  </div>

  <!-- 搜索与工具栏 -->
  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </span>
      <input type="text" id="searchInput" placeholder="搜索变量名或备注..." />
    </div>
    <button id="refreshBtn" class="icon-btn" title="刷新列表" aria-label="刷新列表">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
    </button>
  </div>

  <!-- 双行结构列表容器 -->
  <div class="env-list-container" id="envListContainer">
    <div class="empty-tip">正在加载环境变量...</div>
  </div>

  <!-- 分页 -->
  <div class="pagination">
    <span id="pageInfo">第 1 / 1 页 (共 0 项)</span>
    <div class="page-controls">
      <button id="prevBtn" class="btn btn-sm">上一页</button>
      <button id="nextBtn" class="btn btn-sm">下一页</button>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
