<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Subagent Model Router</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text-primary, #1c1c1e); background: var(--bg-primary, transparent);
  }
  h2 { font-size: 15px; margin: 0 0 8px; }
  h3 { font-size: 13px; margin: 0 0 8px; color: var(--text-secondary, #6b6b70); font-weight: 600; }
  .card { border: 1px solid var(--border-color, rgba(128,128,128,.28)); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .muted { color: var(--text-secondary, #6b6b70); font-size: 12px; }
  .pill { border: 1px solid var(--border-color, rgba(128,128,128,.28)); border-radius: 999px; padding: 2px 8px; font-size: 12px; }
  .pill.ok { color: var(--text-success, #1a7f37); border-color: currentColor; }
  .pill.off { color: var(--text-secondary, #6b6b70); }
  button {
    font: inherit; padding: 7px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border-color, rgba(128,128,128,.35)); background: var(--bg-secondary, rgba(128,128,128,.10)); color: inherit;
    touch-action: manipulation; min-height: 36px;
  }
  button.primary { background: var(--accent-color, #0a84ff); border-color: transparent; color: #fff; }
  button.danger { color: var(--text-danger, #d70015); border-color: currentColor; background: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  input[type="text"] {
    font: inherit; padding: 7px 9px; border-radius: 8px; width: 100%;
    border: 1px solid var(--border-color, rgba(128,128,128,.35)); background: var(--bg-secondary, rgba(128,128,128,.06)); color: inherit;
  }
  .group { border: 1px solid var(--border-color, rgba(128,128,128,.28)); border-radius: 10px; padding: 10px; margin-bottom: 10px; background: var(--bg-secondary, rgba(128,128,128,.04)); }
  .group.dragging { opacity: .5; }
  .group-head { display: flex; gap: 8px; align-items: center; }
  .grip { cursor: grab; user-select: none; padding: 4px 6px; color: var(--text-secondary, #6b6b70); touch-action: none; }
  .group-body { margin-top: 8px; display: grid; gap: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 999px;
    border: 1px solid var(--border-color, rgba(128,128,128,.35)); background: var(--bg-primary, transparent); font-size: 12px;
    touch-action: none; cursor: grab;
  }
  .chip .x { cursor: pointer; color: var(--text-secondary, #6b6b70); padding: 0 2px; }
  .model-list { max-height: 260px; overflow: auto; border-top: 1px solid var(--border-color, rgba(128,128,128,.2)); margin-top: 8px; padding-top: 8px; }
  .model-row { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
  .model-row input { width: 16px; height: 16px; }
  .model-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .providers { display: grid; gap: 10px; }
  .provider-head { font-weight: 600; font-size: 12px; color: var(--text-secondary, #6b6b70); margin-bottom: 4px; }
  .empty { padding: 12px; text-align: center; color: var(--text-secondary, #6b6b70); font-size: 12px; }
  .toast { position: sticky; bottom: 0; margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 12px; display: none; }
  .toast.show { display: block; }
  .toast.ok { background: rgba(26,127,55,.12); color: var(--text-success, #1a7f37); }
  .toast.err { background: rgba(215,0,21,.12); color: var(--text-danger, #d70015); }
  @media (max-width: 520px) { body { padding: 12px; } .row { gap: 6px; } }
</style>
</head>
<body>
  <div class="card">
    <div class="row between">
      <h2>Subagent Model Router · 子代理模型路由</h2>
      <span id="status-pill" class="pill off">读取中…</span>
    </div>
    <p class="muted" id="status-detail"></p>
    <div class="row">
      <button id="btn-install" class="primary">安装 / 更新扩展</button>
      <button id="btn-uninstall" class="danger">卸载扩展</button>
    </div>
  </div>

  <div class="card">
    <h3>分组</h3>
    <div id="groups"></div>
    <div class="row" style="margin-top:8px">
      <button id="btn-add-group">+ 新建分组</button>
    </div>
    <p class="muted" style="margin-bottom:0">拖动分组标题左侧的手柄排序；子代理默认使用「默认分组」的模型顺序，失败时换下一个。</p>
  </div>

  <div class="card">
    <h3>可选模型（按供应商）</h3>
    <p class="muted" style="margin-top:0">只列出当前已启用供应商的可见模型；停用的供应商不会出现。</p>
    <div id="providers" class="providers"><div class="empty">读取中…</div></div>
    <p class="muted" style="margin-bottom:0">在分组里勾选模型，再到分组卡片上拖动调整顺序。</p>
  </div>

  <div class="row">
    <button id="btn-save" class="primary">保存并应用</button>
    <button id="btn-reload">重新读取</button>
  </div>
  <div id="toast" class="toast"></div>

  <script src="settings.js"></script>
</body>
</html>
