<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>CubeSandbox CLI 设置</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: #24292f;
      background: transparent;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color: #c9d1d9;
      }
      input {
        background: #0d1117;
        color: #c9d1d9;
        border-color: #30363d !important;
      }
      .card {
        background: #161b22 !important;
        border-color: #30363d !important;
      }
      .badge-saved {
        background: #1f6feb22 !important;
        color: #58a6ff !important;
        border-color: #388bfd33 !important;
      }
    }
    body {
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .field {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 12px;
    }
    .hint {
      font-size: 11px;
      color: #6e7681;
      margin-top: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #0969da;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      color: #ffffff;
      background: #0969da;
      border: 1px solid rgba(27, 31, 36, 0.15);
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #0860ca;
    }
    button.secondary {
      background: transparent;
      color: inherit;
      border-color: #d0d7de;
    }
    .badge-saved {
      display: inline-block;
      padding: 2px 7px;
      font-size: 11px;
      border-radius: 12px;
      background: #e7f3ff;
      color: #0969da;
      border: 1px solid #b6d7fc;
      margin-left: 8px;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
    }
    #status.success {
      display: block;
      background: #dafbe1;
      color: #1a7f37;
      border: 1px solid #aceebb;
    }
    #status.error {
      display: block;
      background: #ffebe9;
      color: #cf222e;
      border: 1px solid #ffcecb;
    }
  </style>
</head>
<body>
  <div class="field">
    <label>
      CubeSandbox API Key
      <span id="apiKeyBadge" class="badge-saved" style="display:none;">已保存</span>
    </label>
    <input type="password" id="apiKey" placeholder="输入控制面 API 访问密钥（存入主机安全保险库）" />
    <div class="hint">密钥由 Cindy 主机 safeStorage 隔离存储，仅在执行 CLI 时注入环境变量，绝不暴露给前端或模型。</div>
  </div>

  <div class="field">
    <label>控制面地址 (CUBESANDBOX_API_URL)</label>
    <input type="text" id="apiUrl" placeholder="如 https://api.cubesandbox.com" />
    <div class="hint">CubeSandbox 控制面服务的完整 HTTPS URL。</div>
  </div>

  <div class="field">
    <label>代理网关地址 (CUBESANDBOX_PROXY_URL)</label>
    <input type="text" id="proxyUrl" placeholder="如 https://proxy.cubesandbox.com" />
    <div class="hint">用于沙箱内 exec、PTY、文件传输与 AIO 网关数据通道。</div>
  </div>

  <div class="row" style="margin-top: 18px;">
    <button id="saveBtn">保存配置</button>
  </div>

  <div id="status"></div>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const apiUrlInput = document.getElementById('apiUrl');
    const proxyUrlInput = document.getElementById('proxyUrl');
    const apiKeyBadge = document.getElementById('apiKeyBadge');
    const saveBtn = document.getElementById('saveBtn');
    const statusDiv = document.getElementById('status');

    function showStatus(text, isError = false) {
      statusDiv.textContent = text;
      statusDiv.className = isError ? 'error' : 'success';
      statusDiv.style.display = 'block';
      setTimeout(() => { statusDiv.style.display = 'none'; }, 4000);
    }

    async function loadConfig() {
      try {
        // 读取 Secret 状态
        const secRes = await fetch('/secrets');
        if (secRes.ok) {
          const secrets = await secRes.json();
          const target = secrets.find(s => s.key === 'cubesandbox_api_key');
          if (target && target.saved) {
            apiKeyBadge.style.display = 'inline-block';
            apiKeyBadge.textContent = target.tail ? `已保存 (尾号 ${target.tail})` : '已安全保存';
            apiKeyInput.placeholder = '••••••••••••••••（若需更换请重新输入）';
          }
        }

        // 读取 KV
        const kvRes = await fetch('/kv');
        if (kvRes.ok) {
          const kv = await kvRes.json();
          if (kv.CUBESANDBOX_API_URL) apiUrlInput.value = kv.CUBESANDBOX_API_URL;
          if (kv.CUBESANDBOX_PROXY_URL) proxyUrlInput.value = kv.CUBESANDBOX_PROXY_URL;
        }
      } catch (e) {
        console.error('加载配置失败', e);
      }
    }

    saveBtn.addEventListener('click', async () => {
      saveBtn.disabled = true;
      try {
        const keyVal = apiKeyInput.value.trim();
        if (keyVal) {
          const sRes = await fetch('/secrets/cubesandbox_api_key', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ value: keyVal })
          });
          if (!sRes.ok) throw new Error('保存 API Key 失败');
          apiKeyInput.value = '';
        }

        const apiUrl = apiUrlInput.value.trim();
        await fetch('/kv/CUBESANDBOX_API_URL', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(apiUrl)
        });

        const proxyUrl = proxyUrlInput.value.trim();
        await fetch('/kv/CUBESANDBOX_PROXY_URL', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(proxyUrl)
        });

        showStatus('配置已成功保存！');
        await loadConfig();
      } catch (err) {
        showStatus(err.message, true);
      } finally {
        saveBtn.disabled = false;
      }
    });

    loadConfig();
  </script>
</body>
</html>
