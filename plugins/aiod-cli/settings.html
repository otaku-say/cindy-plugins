<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Aiod CLI 设置</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: #24292f;
      background: transparent;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color: #c9d1d9;
      }
      input {
        background: #0d1117;
        color: #c9d1d9;
        border-color: #30363d !important;
      }
      .badge-saved {
        background: #1f6feb22 !important;
        color: #58a6ff !important;
        border-color: #388bfd33 !important;
      }
    }
    body {
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .field {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 12px;
    }
    .hint {
      font-size: 11px;
      color: #6e7681;
      margin-top: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #0969da;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      color: #ffffff;
      background: #0969da;
      border: 1px solid rgba(27, 31, 36, 0.15);
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #0860ca;
    }
    .badge-saved {
      display: inline-block;
      padding: 2px 7px;
      font-size: 11px;
      border-radius: 12px;
      background: #e7f3ff;
      color: #0969da;
      border: 1px solid #b6d7fc;
      margin-left: 8px;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
    }
    #status.success {
      display: block;
      background: #dafbe1;
      color: #1a7f37;
      border: 1px solid #aceebb;
    }
    #status.error {
      display: block;
      background: #ffebe9;
      color: #cf222e;
      border: 1px solid #ffcecb;
    }
  </style>
</head>
<body>
  <div class="field">
    <label>默认沙箱网关 (SANDBOX_BASE)</label>
    <input type="text" id="sandboxBase" placeholder="如 https://proxy.cubesandbox.com/sandbox/sid-123/8080" />
    <div class="hint">默认指向的沙箱 aiod 网关地址（单个工具调用也可通过 base 参数临时指定）。</div>
  </div>

  <div class="field">
    <label>
      沙箱鉴权 Key (SANDBOX_KEY)
      <span id="keyBadge" class="badge-saved" style="display:none;">已保存</span>
    </label>
    <input type="password" id="sandboxKey" placeholder="输入沙箱 aiod 网关鉴权 Key（可选）" />
    <div class="hint">若沙箱开启了访问鉴权，密钥由 Cindy safeStorage 隔离存储并在执行时注入环境变量。</div>
  </div>

  <div class="row" style="margin-top: 18px;">
    <button id="saveBtn">保存设置</button>
  </div>

  <div id="status"></div>

  <script>
    const baseInput = document.getElementById('sandboxBase');
    const keyInput = document.getElementById('sandboxKey');
    const keyBadge = document.getElementById('keyBadge');
    const saveBtn = document.getElementById('saveBtn');
    const statusDiv = document.getElementById('status');

    function showStatus(text, isError = false) {
      statusDiv.textContent = text;
      statusDiv.className = isError ? 'error' : 'success';
      statusDiv.style.display = 'block';
      setTimeout(() => { statusDiv.style.display = 'none'; }, 4000);
    }

    async function loadConfig() {
      try {
        const secRes = await fetch('/secrets');
        if (secRes.ok) {
          const secrets = await secRes.json();
          const target = secrets.find(s => s.key === 'sandbox_key');
          if (target && target.saved) {
            keyBadge.style.display = 'inline-block';
            keyBadge.textContent = target.tail ? `已保存 (尾号 ${target.tail})` : '已安全保存';
            keyInput.placeholder = '••••••••••••••••（若需更换请重新输入）';
          }
        }
        const kvRes = await fetch('/kv');
        if (kvRes.ok) {
          const kv = await kvRes.json();
          if (kv.SANDBOX_BASE) baseInput.value = kv.SANDBOX_BASE;
        }
      } catch (e) {
        console.error('加载配置失败', e);
      }
    }

    saveBtn.addEventListener('click', async () => {
      saveBtn.disabled = true;
      try {
        const keyVal = keyInput.value.trim();
        if (keyVal) {
          const sRes = await fetch('/secrets/sandbox_key', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ value: keyVal })
          });
          if (!sRes.ok) throw new Error('保存鉴权 Key 失败');
          keyInput.value = '';
        }

        const baseVal = baseInput.value.trim();
        await fetch('/kv/SANDBOX_BASE', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(baseVal)
        });

        showStatus('设置已保存！');
        await loadConfig();
      } catch (err) {
        showStatus(err.message, true);
      } finally {
        saveBtn.disabled = false;
      }
    });

    loadConfig();
  </script>
</body>
</html>
