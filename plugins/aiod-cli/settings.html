<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Aiod CLI 设置</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: inherit;
    }
    body {
      margin: 0;
      padding: 14px;
      box-sizing: border-box;
    }
    .field {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 12px;
    }
    .hint {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      border: 1px solid var(--border-default, #d0d7de);
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background: var(--surface, #ffffff);
      color: inherit;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #0969da;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 500;
      color: #ffffff;
      background: #0969da;
      border: 1px solid rgba(27, 31, 36, 0.15);
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #0860ca;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .badge-saved {
      display: inline-block;
      padding: 2px 7px;
      font-size: 11px;
      border-radius: 12px;
      background: rgba(9, 105, 218, 0.12);
      color: #0969da;
      border: 1px solid rgba(9, 105, 218, 0.25);
      margin-left: 8px;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
    }
    #status.success {
      display: block;
      background: rgba(46, 160, 67, 0.15);
      color: #2ea043;
      border: 1px solid rgba(46, 160, 67, 0.3);
    }
    #status.error {
      display: block;
      background: rgba(207, 34, 46, 0.15);
      color: #cf222e;
      border: 1px solid rgba(207, 34, 46, 0.3);
    }
  </style>
</head>
<body>
  <div class="field">
    <label>默认沙箱网关 (SANDBOX_BASE)</label>
    <input type="text" id="sandboxBase" placeholder="如 https://proxy.cubesandbox.com/sandbox/sid-123/8080" />
    <div class="hint">默认指向的沙箱 aiod 网关地址（单个工具调用也可通过 base 参数临时指定）。</div>
  </div>

  <div class="field">
    <label>
      沙箱鉴权 Key (SANDBOX_KEY)
      <span id="keyBadge" class="badge-saved" style="display:none;">已保存</span>
    </label>
    <input type="password" id="sandboxKey" placeholder="输入沙箱 aiod 网关鉴权 Key（可选）" />
    <div class="hint">若沙箱开启了访问鉴权，密钥由 Cindy safeStorage 隔离存储并在执行时注入环境变量。</div>
  </div>

  <div class="row" style="margin-top: 18px;">
    <button id="saveBtn">保存设置</button>
  </div>

  <div id="status"></div>

  <!-- CSP 约束：脚本外挂为独立 JS 文件 -->
  <script src="settings.js"></script>
</body>
</html>
